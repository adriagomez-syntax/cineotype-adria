<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 52" width="100%" height="100%">
  <defs>
    <!-- Cyan gradient for play button and wave accents -->
    <linearGradient id="cwIconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46E8F8" />
      <stop offset="100%" stop-color="#27D5E6" />
    </linearGradient>

    <!-- Dark container gradient -->
    <linearGradient id="cwIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142629" />
      <stop offset="100%" stop-color="#0A1214" />
    </linearGradient>
  </defs>

  <!-- Group for Logo Icon -->
  <g transform="translate(6, 6)">
    <!-- Rounded circular / squircle badge container -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#cwIconBg)" stroke="#27D5E6" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Thin dashed/segmented cinematic lens ring -->
    <circle cx="20" cy="20" r="14.5" fill="none" stroke="#E69727" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" />

    <!-- Play arrow icon with rounded apex and corners -->
    <path d="M 16.5 13.5 C 16.5 12.6 17.5 12.1 18.2 12.6 L 27.5 18.8 C 28.2 19.3 28.2 20.7 27.5 21.2 L 18.2 27.4 C 17.5 27.9 16.5 27.4 16.5 26.5 Z" 
          fill="url(#cwIconCyan)"/>
  </g>

  <!-- Brand Typography: CineWave -->
  <g transform="translate(56, 33)">
    <!-- Text CineWave with Serif Playfair Display style -->
    <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="-0.3">
      <tspan fill="#F1F5F9" >Cine</tspan><tspan fill="#27D5E6">Wave</tspan>
    </text>
  </g>
</svg>